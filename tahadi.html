    const wheelBtn = '<button class="btn ghost sm mc-pause" id="mcWheel">🎡 دولاب جوائز الحضور</button>';
    const busy = sent === S.phase + ':' + S.qi;
    const head = `<div class="mc-head"><span>🎤 ${esc(S.mc.name)}</span><span>${esc(S.week||'')}</span></div>`;
    const nextBtn = label => `<button class="btn mc-next" id="mcNext" ${busy ? 'disabled' : ''}>${busy ? 'جارٍ التنفيذ…' : label}</button>`;
    const opts = (S.options||[]).map((o, j) => `<div class="pbtn c${j} mc-opt ${j === S.correct ? 'right' : ''}"><span class="shape">${SHAPES[j]}</span><span style="flex:1">${esc(o)}</span>${j === S.correct ? '<b class="mc-ok">✓ الصحيحة</b>' : ''}${S.counts ? `<span class="mc-cnt">${toAr(S.counts[j])}</span>` : ''}</div>`).join('');
    let body = '';
    if (S.phase === 'lobby'){
      body = `<div class="center" style="flex:0;padding:10px 0"><div class="big-emoji">👥</div><h2>${toAr(S.np)} فريق انضم</h2><p>عدد الأسئلة: ${toAr(S.total)}. اضغط البدء عندما يكتمل الحضور.</p></div>${S.np ? nextBtn('ابدأ المسابقة ←') : '<p class="mc-note">بانتظار انضمام أول فريق…</p>'}${wheelBtn}`;
    } else if (S.phase === 'question' || S.phase === 'reveal'){
      const rev = S.phase === 'reveal';
      body = `<div class="pmeta"><span>السؤال ${toAr(S.qi+1)} من ${toAr(S.total)}${S.cat ? ' · ' + esc(S.cat) : ''}</span>${rev ? '<span class="t">كُشفت الإجابة</span>' : '<span class="t" id="mcT"></span>'}</div>
        <div class="pq">${esc(S.text)}</div><div class="pbtns" style="flex:0">${opts}</div>
        <div class="stats" style="margin:12px 0"><div class="stat"><b>${toAr(S.ans)}</b><span>أجابوا من ${toAr(S.np)}</span></div>${rev ? `<div class="stat"><b>${toAr(S.counts ? S.counts[S.correct] : 0)}</b><span>إجابة صحيحة</span></div>` : ''}</div>
        ${nextBtn(rev ? 'لوحة الصدارة ←' : 'إظهار الإجابة الآن')}${rev && S.auto ? '<button class="btn ghost sm mc-pause" id="mcPause">⏸ إيقاف الانتقال التلقائي</button>' : ''}`;
    } else if (S.phase === 'board' || S.phase === 'final'){
      const fin = S.phase === 'final', last = S.qi + 1 >= S.total;
      body = `<h2 class="kufi" style="text-align:center;margin:8px 0 10px">${fin ? '🏆 الفائزون' : 'لوحة الصدارة'}</h2>
        <div class="rows">${(S.top||[]).map((p, i) => `<div class="row" style="font-size:17px;padding:10px 14px"><span class="rk" style="width:36px;height:36px">${toAr(i+1)}</span><span class="nm">${esc(p[0])}</span><span class="sc" style="font-size:20px">${toAr(p[1])}</span></div>`).join('') || '<p class="mc-note">لا توجد فرق</p>'}</div>
        <div style="height:12px"></div>${fin ? wheelBtn + '<p class="mc-note">انتهت الجولة. التتويج بمجموع الجولات يُعرض من شاشة العرض.</p>' : nextBtn(last ? 'إعلان الفائزين 🏆' : 'السؤال التالي ←') + (S.auto ? '<button class="btn ghost sm mc-pause" id="mcPause">⏸ إيقاف الانتقال التلقائي</button>' : '')}`;
    }
    app.innerHTML = `<div class="phone mc">${head}${body}</div>`;
    if ($('#mcNext')) $('#mcNext').onclick = () => cmd('next');
    if ($('#mcWheel')) $('#mcWheel').onclick = () => cmd('wopen');
    if ($('#mcPause')) $('#mcPause').onclick = () => { cmd('pause'); $('#mcPause').remove(); };
    if ($('#mcT')){ const upd = () => { const el = $('#mcT'); if (el) el.textContent = toAr(Math.ceil(Math.max(0, localEnd - Date.now())/1000)); }; upd(); timer = setInterval(upd, 250); }
  }
  const keepAwake = async () => { try { await navigator.wakeLock?.request('screen'); } catch(e){} };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
  keepAwake();
  render();
  connectTransport(onMsg).then(n => {
    net = n; net.subscribe(T + '/m' + MCK);
    net.onConnect(claim);                                   // with no name yet this only asks the big screen for the current state
    setInterval(() => { if (me.name && !editing && S && S.phase !== 'closed' && !S.mc) claim(); }, 3000);
  }).catch(e => { setNet('off'); screen('⚠️', 'تعذّر الاتصال', `<p>${e && e.message && /[؀-ۿ]/.test(e.message) ? esc(e.message) : 'تأكد من اتصال الهاتف بالإنترنت ثم أعد فتح الرابط.'}</p>`); });
}

/* ================= boot ================= */
if (ROOM && !IS_HOST && params.get('mc')) mcMain();
else if (ROOM && !IS_HOST) playerMain();
else hostMain(loadScript(['https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js','https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js']).catch(()=>{}));
</script>
</body>
</html>
