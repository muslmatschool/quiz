  function updateAnswered(){
    const el = $('#ansCount'); if (el) el.textContent = toAr(Object.keys(G.answers).length);
    const tc = $('#teamCount'); if (tc) tc.textContent = toAr(Object.keys(G.players).length);
  }
  function renderBoard(){
    const r = ranked().slice(0, 8), last = G.qi + 1 >= G.qs.length;
    app.innerHTML = `
      <div class="board">
        <h2 class="kufi">لوحة الصدارة</h2>
        <div class="rows">${r.length ? r.map((p, i) => `
          <div class="row r${i+1}" style="animation-delay:${i*70}ms"><span class="rk">${toAr(i+1)}</span><span class="nm">${esc(p.s)}<small>${p.g ? 'مع ' + esc(p.g) : ''}</small></span><span class="sc">${toAr(p.score)}</span>${p.last && p.last.pts ? `<span class="gain">+${toAr(p.last.pts)}</span>` : ''}</div>`).join('') : '<div class="empty" style="text-align:center">لا توجد فرق</div>'}
        </div>
        <div style="display:flex;justify-content:center;gap:10px;margin-top:24px"><button class="btn ghost hidden" id="pauseBtn">⏸ إيقاف مؤقت</button><button class="btn" id="nextBtn">${last ? 'إعلان الفائزين 🏆' : 'السؤال التالي ←'}</button></div>
      </div>`;
    $('#nextBtn').onclick = next;
    armAuto(last ? 'إعلان الفائزين 🏆' : 'السؤال التالي ←');
  }
  let celebrated = '';
  function renderFinal(){
    clearInterval(tick);
    const r = ranked(), nW = Math.min(cfg.winners, r.length), rest = r.slice(nW);
    const pod = (p, k) => p && k <= nW ? `<div class="pod p${k}"><div class="who">${esc(p.s)}<small>${p.g ? 'مع ' + esc(p.g) : ''}</small></div><div class="pts">${toAr(p.score)} نقطة</div><div class="block">${toAr(k)}</div></div>` : '';
    const row = (p, k, d) => `<div class="row" style="animation-delay:${d*50}ms"><span class="rk">${toAr(k)}</span><span class="nm">${esc(p.s)}<small>${p.g ? 'مع ' + esc(p.g) : ''}</small></span><span class="sc">${toAr(p.score)}</span></div>`;
    app.innerHTML = `
      <div class="board">
        <h2 class="kufi">${nW === 1 ? '🏆 الفائز 🏆' : '🏆 الفائزون 🏆'}</h2>
        ${r.length ? `<div class="podium">${pod(r[1],2)}${pod(r[0],1)}${pod(r[2],3)}</div>` : '<div class="empty" style="text-align:center">لا توجد فرق</div>'}
        <div class="rows">${r.slice(3, nW).map((p, i) => row(p, i+4, i)).join('')}</div>
        ${rest.length ? `<div class="rows hidden" id="restRows" style="margin-top:18px"><div class="resthead">بقية الترتيب</div>${rest.map((p, i) => row(p, nW+i+1, i)).join('')}</div>` : ''}
        <div style="display:flex;justify-content:center;gap:10px;margin-top:24px;flex-wrap:wrap">
          ${WEEKS.length > 1 && (G.week||cfg.week) === WEEKS[WEEKS.length-1] ? '<button class="btn" id="crownBtn">🏆 تتويج الأبطال بمجموع الجولات</button>' : ''}
          <button class="btn" id="wheelBtn">🎡 دولاب جوائز الحضور</button>
          ${rest.length ? '<button class="btn ghost" id="restBtn">عرض بقية الترتيب</button>' : ''}
          <button class="btn ghost" id="csvBtn">تنزيل النتائج</button><button class="btn ghost" id="allBoardBtn">الترتيب التراكمي</button>
          <button class="btn ghost" id="newBtn">مسابقة جديدة</button>
        </div>
      </div>`;
    if ($('#restBtn')) $('#restBtn').onclick = () => { const hid = $('#restRows').classList.toggle('hidden'); $('#restBtn').textContent = hid ? 'عرض بقية الترتيب' : 'إخفاء بقية الترتيب'; };
    archiveCurrent();
    if (celebrated !== G.gid){ celebrated = G.gid; confetti(); }      // once per game, not every time we come back from the wheel
    $('#wheelBtn').onclick = () => renderWheel(renderPhase);
    $('#allBoardBtn').onclick = () => renderCumulative(renderPhase);
    if ($('#crownBtn')) $('#crownBtn').onclick = () => renderCrown(renderPhase);
    $('#newBtn').onclick = () => { if (confirm('إنهاء هذه المسابقة والعودة للإعداد؟ (النتائج محفوظة في سجل الجولات)')) endRoom(); };
    $('#csvBtn').onclick = () => downloadCSV('نتائج-'+fileSafe(cfg.title)+'-'+fileSafe(G.week||cfg.week)+'.csv', [['الترتيب','اسم المشارك / الفريق','العضو الثاني','النقاط']].concat(r.map((p,i)=>[i+1,p.s,p.g,p.score])));
  }
  function endRoom(){
    clearInterval(tick); stopAuto();
    if (net && G && G.mcKey) net.publish(T + '/m' + G.mcKey, JSON.stringify({v:1, phase:'closed'}), true);
    $('#mcPanel')?.remove();
    if (net && G){ G.phase = 'closed'; net.publish(T + '/s', JSON.stringify({v:1, phase:'closed', title:cfg.title, sub:cfg.sub}), true); }
    sdel('qms_game'); G = null; renderSetup();
  }
  function confetti(){
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const box = $('#confetti'); box.innerHTML = '';
    const colors = ['#d6a640','#f3d58a','#ffffff','#2e8b57','#c0392b','#1f6fb5'];
    for (let i = 0; i < 120; i++){
      const el = document.createElement('i');
      el.style.left = Math.random()*100 + 'vw'; el.style.background = colors[i % colors.length];
      el.style.animationDuration = (2.5 + Math.random()*2.5) + 's'; el.style.animationDelay = Math.random()*1.5 + 's';
      box.appendChild(el);
    }
    setTimeout(() => box.innerHTML = '', 7000);
  }
  let actx = null;
  function beep(f, d, type, vol){
    try { actx = actx || new (window.AudioContext||window.webkitAudioContext)(); const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = f; o.type = type || 'sine'; g.gain.value = vol || .12; o.connect(g); g.connect(actx.destination); o.start();
      g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + d); o.stop(actx.currentTime + d + .02); } catch(e){}
  }

  /* ================= attendance prize wheel ================= */
  const ORD = ['الأولى','الثانية','الثالثة','الرابعة','الخامسة','السادسة','السابعة','الثامنة','التاسعة','العاشرة'];
  const WKEY = 'quran-wheel-v1';
  function renderWheel(back){
    view = 'other'; stopAuto(); document.body.classList.add('compact');
    let W = {mode:'num', from:1, to:150, names:'', remove:true, prizes: ORD.slice(0,5).map(o => 'الجائزة ' + o), pool:[], winners:[]};
    const s0 = sget(WKEY, null);
    if (s0 && Array.isArray(s0.pool)) W = Object.assign(W, s0);
    if (!Array.isArray(W.prizes) || !W.prizes.length) W.prizes = ORD.slice(0,5).map(o => 'الجائزة ' + o);
    if (!Array.isArray(W.winners)) W.winners = [];
    const save = () => sset(WKEY, W);
    const buildPool = () => {
      if (W.mode === 'num'){
        let a = Math.max(1, Math.floor(+W.from||1)), b = Math.max(a, Math.floor(+W.to||a));
        if (b - a > 2000) b = a + 2000;
        const p = []; for (let i = a; i <= b; i++) p.push(toAr(i)); return p;
      }
      return [...new Set(String(W.names).split(/\n+/).map(s => s.trim()).filter(Boolean))];
    };
    if (!W.pool.length && !W.winners.length) W.pool = buildPool();

    app.innerHTML = `
      <div class="wz">
        <div class="wz-head">
          <h2 class="kufi">🎡 دولاب جوائز الحضور</h2>
          <div class="wz-tools"><button class="wz-btn" id="wzToggle" type="button">الإعدادات</button><button class="wz-btn primary" id="wzBack" type="button">→ العودة</button></div>
        </div>
        <section class="wz-setup wz-panel hidden" id="wzSetup">
          <div class="wz-grid">
            <div>
              <h3>المشاركون في السحب</h3>
              <div class="wz-seg" role="group" aria-label="طريقة إدخال المشاركين">
                <button type="button" id="wzModeNum">أرقام التذاكر</button>
                <button type="button" id="wzModeNames">قائمة أسماء</button>
              </div>
              <div id="wzNumBox" class="wz-row">
                <div><label for="wzFrom">من رقم</label><input id="wzFrom" type="number" min="1" inputmode="numeric"></div>
                <div><label for="wzTo">إلى رقم</label><input id="wzTo" type="number" min="1" inputmode="numeric"></div>
              </div>
              <div id="wzNamesBox">
                <label for="wzNames">اسم أو رقم في كل سطر</label>
                <textarea id="wzNames" placeholder="مثال:&#10;أم محمد&#10;أبو سالم&#10;..."></textarea>
                <div class="wz-actions" style="margin-top:8px"><button class="wz-btn" id="wzImport" type="button">جلب أسماء المشاركين في المسابقة</button><span class="wz-note" id="wzImportMsg" style="margin:0"></span></div>
              </div>
              <p class="wz-note">اقتراح: وزّعوا تذاكر مرقّمة على الحضور عند الدخول، ثم اكتبوا أول رقم وآخر رقم هنا.</p>
              <label class="wz-check"><input type="checkbox" id="wzRemove"> استبعاد الفائز من الدولاب بعد فوزه</label>
            </div>
            <div>
              <h3>الجوائز (بترتيب السحب)</h3>
              <div class="wz-row" style="margin-bottom:10px"><div style="max-width:160px"><label for="wzPrizeN">عدد الجوائز</label><input id="wzPrizeN" type="number" min="1" max="10" inputmode="numeric"></div></div>
              <div id="wzPrizeInputs" style="display:flex;flex-direction:column;gap:8px"></div>
              <div class="wz-actions">
                <button class="wz-btn primary" id="wzApply" type="button">تطبيق وبدء سحب جديد</button>
                <span id="wzConfirm" class="wz-confirm hidden">سيُمسح الفائزون الحاليون. هل أنت متأكد؟
                  <button class="wz-btn primary" id="wzYes" type="button">نعم</button>
                  <button class="wz-btn" id="wzNo" type="button">إلغاء</button></span>
              </div>
            </div>
          </div>
        </section>
        <div class="wz-stage">
          <aside class="wz-rail">
            <div class="wz-panel wz-now">
              <div class="lbl" id="wzNowLbl"></div>
              <div class="prize" id="wzNowPrize"></div>
              <div class="left" id="wzNowLeft"></div>
              <button class="wz-spin" id="wzSpin" type="button">أدِر الدولاب</button>
            </div>
            <div class="wz-panel">
              <h3>الفائزون</h3>
              <ol class="wz-winners" id="wzWinners"></ol>
              <div class="wz-actions">
                <button class="wz-btn" id="wzUndo" type="button">تراجع عن آخر سحب</button>
                <button class="wz-btn" id="wzCsv" type="button">تنزيل قائمة الفائزين</button>
              </div>
            </div>
          </aside>
          <div>
            <div class="wz-wrap">
              <svg class="wz-pointer" viewBox="0 0 62 76" aria-hidden="true"><path d="M31 74 L4 18 A28 28 0 1 1 58 18 Z" fill="#e3b954" stroke="#0d3b2e" stroke-width="4"/><circle cx="31" cy="26" r="9" fill="#0d3b2e"/></svg>
              <canvas id="wzWheel" aria-label="دولاب السحب"></canvas>
              <div class="wz-hub"><img alt="" src="${window.LOGO_DATA}"></div>
            </div>
            <div class="wz-count" id="wzCount"></div>
          </div>
        </div>
        <div class="wz-overlay hidden" id="wzOverlay">
          <div class="wz-card" role="dialog" aria-live="assertive">
            <div class="k">الفائز في السحب على</div>
            <div class="pz" id="wzOvPrize"></div>
            <div class="win" id="wzOvWin"></div>
            <div class="congrats">مبارك! 🎉</div>
            <button class="wz-btn primary" id="wzOvClose" type="button">متابعة</button>
          </div>
        </div>
      </div>`;

    /* ---- drawing ---- */
    const cv = $('#wzWheel'), ctx = cv.getContext('2d');
    let rot = 0, spinning = false, ovLast = null;
    const COLORS = ['#0f4a3a','#e3b954','#f6efdf'], TEXTC = ['#f6efdf','#0d3b2e','#0d3b2e'];
    function draw(){
      if (!cv.isConnected) return;
      const rc = cv.getBoundingClientRect(), d = Math.max(200, Math.round(Math.min(rc.width, rc.height) * (window.devicePixelRatio||1)));
      if (cv.width !== d){ cv.width = d; cv.height = d; }
      const Wd = cv.width, c = Wd/2, R = c*0.96, items = W.pool, n = items.length;
      ctx.clearRect(0,0,Wd,Wd);
      ctx.beginPath(); ctx.arc(c,c,c*0.995,0,Math.PI*2); ctx.fillStyle = '#c9973a'; ctx.fill();
      ctx.beginPath(); ctx.arc(c,c,c*0.975,0,Math.PI*2); ctx.fillStyle = '#e3b954'; ctx.fill();
      if (!n){
        ctx.beginPath(); ctx.arc(c,c,R,0,Math.PI*2); ctx.fillStyle='#0f4a3a'; ctx.fill();
        ctx.fillStyle='#f6efdf'; ctx.font = `${Wd*0.045}px "Mohammad Bold", Tahoma`; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.direction='rtl'; ctx.fillText('أضيفوا المشاركين من الإعدادات', c, c - Wd*0.2);
      } else {
        const seg = Math.PI*2/n;
        const fontPx = Math.max(9, Math.min(Wd*0.05, (R*seg)*0.55, Wd*0.9/Math.max(6, n)*2.2));
        for (let i = 0; i < n; i++){
          const a0 = rot + i*seg - Math.PI/2, a1 = a0 + seg;
          const ci = (n%3===1 && n>1 && i===n-1) ? 1 : i%3;      // avoid the same colour meeting at the seam
          ctx.beginPath(); ctx.moveTo(c,c); ctx.arc(c,c,R,a0,a1); ctx.closePath();
          ctx.fillStyle = COLORS[ci]; ctx.fill();
          if (n <= 240){ ctx.strokeStyle='rgba(13,59,46,.35)'; ctx.lineWidth = Math.max(1, Wd*0.0015); ctx.stroke(); }
          if (n <= 160){
            ctx.save(); ctx.translate(c,c); ctx.rotate(a0 + seg/2);
            ctx.fillStyle = TEXTC[ci]; ctx.font = `${fontPx}px "Mohammad Bold", Tahoma`; ctx.textAlign='right'; ctx.textBaseline='middle'; ctx.direction='rtl';
            let t = items[i]; if (t.length > 14) t = t.slice(0,13)+'…';
            ctx.fillText(t, R*0.93, 0); ctx.restore();
          }
        }
      }
      for (let i = 0; i < 24; i++){ const a = i/24*Math.PI*2; ctx.beginPath(); ctx.arc(c+Math.cos(a)*c*0.985, c+Math.sin(a)*c*0.985, c*0.012, 0, Math.PI*2); ctx.fillStyle = i%2?'#fff6d6':'#0d3b2e'; ctx.fill(); }
    }
    wheelDraw = draw;

    /* ---- spin ---- */
    const prizeIdx = () => W.winners.length;
    function spin(){
      const n = W.pool.length;
      if (spinning || !n || prizeIdx() >= W.prizes.length) return;
      spinning = wheelBusy = true; render();
      const win = rand(n), seg = Math.PI*2/n, TAU = Math.PI*2;
      // pointer is at the top; segment i is centred on it when rot ≡ -(i*seg + seg/2)
      const jitter = (Math.random()-0.5) * seg * 0.7;
      const target = (((-(win*seg + seg/2) + jitter) % TAU) + TAU) % TAU;
      const turns = 7 + rand(3);
      const start = rot, base = Math.floor(start / TAU) * TAU;
      let end = base + turns*TAU + target;
      if (end - start < turns*TAU) end += TAU;
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const dur = reduce ? 1200 : 9000 + rand(1500);
      const t0 = performance.now(); let lastIdx = -1;
      const ease = t => 1 - Math.pow(1 - t, 4);
      (function frame(now){
        if (!cv.isConnected){ spinning = wheelBusy = false; return; }
        const t = Math.min(1, Math.max(0, (now - t0)/dur));
        rot = start + (end - start) * ease(t);
        const idx = Math.floor((((-rot) % TAU) + TAU) % TAU / seg);
        if (idx !== lastIdx){ if (lastIdx !== -1) beep(1400, .05, 'triangle'); lastIdx = idx; }
        draw();
        if (t < 1) requestAnimationFrame(frame); else finish(win);
      })(t0);
    }
    function finish(i){
      const value = W.pool[i], prize = W.prizes[prizeIdx()];
      W.winners.push({prize, value});
      if (W.remove) W.pool.splice(i,1);
      rot = rot % (Math.PI*2);
      spinning = wheelBusy = false; save(); render();
      $('#wzOvPrize').textContent = prize; $('#wzOvWin').textContent = value;
      $('#wzOverlay').classList.remove('hidden'); $('#wzOvClose').focus(); ovLast = {prize, value}; publishNow();
      [523.25,659.25,783.99,1046.5].forEach((f,k) => setTimeout(() => beep(f, .6, 'sine', .16), k*120));
      confetti();
    }

    /* ---- UI ---- */
    function render(){
      const k = prizeIdx(), total = W.prizes.length, done = k >= total;
      $('#wzNowLbl').textContent = done ? 'انتهى السحب' : 'السحب التالي على';
      $('#wzNowPrize').textContent = done ? 'مبارك للفائزين' : W.prizes[k];
      $('#wzNowLeft').textContent = done ? '' : `المتبقي: ${toAr(total - k)} من ${toAr(total)}`;
      $('#wzSpin').disabled = spinning || done || !W.pool.length;
      $('#wzSpin').textContent = spinning ? 'يدور…' : 'أدِر الدولاب';
      $('#wzCount').textContent = `عدد المشاركين في الدولاب: ${toAr(W.pool.length)}`;
      $('#wzUndo').disabled = spinning || !W.winners.length;
      $('#wzCsv').disabled = !W.winners.length;
      $('#wzBack').disabled = spinning; $('#wzToggle').disabled = spinning;
      const ul = $('#wzWinners'); ul.innerHTML = '';
      W.prizes.forEach((p,i) => {
        const w = W.winners[i], li = document.createElement('li');
        if (!w) li.className = 'empty';
        li.innerHTML = `<span class="n">${toAr(i+1)}</span><span class="p"></span><span class="w"></span>`;
        li.querySelector('.p').textContent = p; li.querySelector('.w').textContent = w ? w.value : '—';
        ul.appendChild(li);
      });
      draw();
      publishNow();                      // keep the presenter's phone in step with the wheel
    }
    let formMode = W.mode;
    function setMode(m){
      formMode = m;
      $('#wzModeNum').setAttribute('aria-pressed', m==='num'); $('#wzModeNames').setAttribute('aria-pressed', m==='names');
      $('#wzNumBox').classList.toggle('hidden', m!=='num'); $('#wzNamesBox').classList.toggle('hidden', m!=='names');
    }
    function prizeInputs(n, keep){
      const box = $('#wzPrizeInputs');
      const cur = keep ? [...box.querySelectorAll('input')].map(i => i.value) : W.prizes;
      box.innerHTML = '';
      for (let i = 0; i < n; i++){
        const d = document.createElement('div');
        d.innerHTML = `<label for="wzPz${i}">الجائزة ${toAr(i+1)}</label><input id="wzPz${i}" type="text" maxlength="40">`;
        box.appendChild(d); d.querySelector('input').value = cur[i] || ('الجائزة ' + ORD[i]);
      }
    }
    function fillSetup(){
      $('#wzFrom').value = W.from; $('#wzTo').value = W.to; $('#wzNames').value = W.names; $('#wzRemove').checked = W.remove;
      $('#wzPrizeN').value = W.prizes.length; $('#wzImportMsg').textContent = '';
      setMode(W.mode); prizeInputs(W.prizes.length, false);
    }
    function apply(){
      W.from = Math.max(1, Math.floor(+$('#wzFrom').value) || 1); W.to = Math.max(W.from, Math.floor(+$('#wzTo').value) || W.from);
      W.names = $('#wzNames').value; W.remove = $('#wzRemove').checked; W.mode = formMode;
      W.prizes = [...$('#wzPrizeInputs').querySelectorAll('input')].map((inp,i) => inp.value.trim() || ('الجائزة ' + ORD[i]));
      W.pool = buildPool(); W.winners = []; rot = 0;
      save(); render(); $('#wzSetup').classList.add('hidden'); $('#wzToggle').textContent = 'الإعدادات';
      if (!W.pool.length) alert('قائمة المشاركين في السحب فارغة. افتح الإعدادات وأضف الأسماء أو أرقام التذاكر.');
    }
    function quizNames(){
      let list = [];
      if (G && Object.keys(G.players).length) list = Object.values(G.players);
      else { const a = archives(); if (a.length) list = a[a.length-1].players || []; }
      return list.map(p => (p.s||'').trim() + (p.g ? ' و' + String(p.g).trim() : '')).filter(Boolean);
    }
    const arNum = s => +String(s).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));

    $('#wzSpin').onclick = spin;
    $('#wzOvClose').onclick = () => { $('#wzOverlay').classList.add('hidden'); $('#wzSpin').focus(); ovLast = null; publishNow(); };
    $('#wzUndo').onclick = () => {
      if (spinning || !W.winners.length) return;
      const w = W.winners.pop();
      if (W.remove && !W.pool.includes(w.value)) W.pool.push(w.value);
      if (W.mode === 'num') W.pool.sort((a,b) => arNum(a) - arNum(b));
      rot = 0; save(); render();
    };
    $('#wzCsv').onclick = () => downloadCSV('الفائزون-بجوائز-الحضور.csv', [['م','الجائزة','الفائز'], ...W.winners.map((w,i) => [i+1, w.prize, w.value])]);
    $('#wzToggle').onclick = () => { const s = $('#wzSetup'); const open = s.classList.toggle('hidden') === false; $('#wzToggle').textContent = open ? 'إخفاء الإعدادات' : 'الإعدادات'; if (open) fillSetup(); $('#wzConfirm').classList.add('hidden'); draw(); };
    $('#wzModeNum').onclick = () => setMode('num');
    $('#wzModeNames').onclick = () => setMode('names');
    $('#wzPrizeN').onchange = e => { const n = Math.min(10, Math.max(1, Math.floor(+e.target.value) || 1)); e.target.value = n; prizeInputs(n, true); };
    $('#wzImport').onclick = () => {
      const names = quizNames();
      if (!names.length){ $('#wzImportMsg').textContent = 'لا يوجد مشاركون مسجَّلون في المسابقة بعد.'; return; }
      $('#wzNames').value = names.join('\n'); $('#wzImportMsg').textContent = `عدد الأسماء المجلوبة: ${toAr(names.length)} — اضغط «تطبيق وبدء سحب جديد» لاعتمادها.`;
    };
    $('#wzApply').onclick = () => { if (W.winners.length) $('#wzConfirm').classList.remove('hidden'); else apply(); };
    $('#wzYes').onclick = () => { $('#wzConfirm').classList.add('hidden'); apply(); };
    $('#wzNo').onclick = () => $('#wzConfirm').classList.add('hidden');
    $('#wzBack').onclick = () => { if (spinning) return; wheelDraw = null; wheelApi = null; document.body.classList.remove('compact'); $('#confetti').innerHTML = ''; back(); publishNow(); };
    wheelApi = {
      spin, ok: () => { if (ovLast) $('#wzOvClose').click(); }, back: () => $('#wzBack').click(),
      state: () => { const k = prizeIdx(), done = k >= W.prizes.length; return {prize: done ? '' : W.prizes[k], left: W.prizes.length - k, total: W.prizes.length, pool: W.pool.length, spinning, done, last: ovLast, winners: W.winners.map(w => [w.prize, w.value])}; }
    };
    setMode(W.mode);
    render();
    document.fonts && document.fonts.ready.then(draw);
  }
  addEventListener('resize', () => { if (wheelDraw) wheelDraw(); });

  /* ---------- keyboard & safety ---------- */
  document.addEventListener('keydown', e => {
    const ov = $('#wzOverlay');
    if (ov && !ov.classList.contains('hidden') && (e.code === 'Space' || e.code === 'Enter')){ e.preventDefault(); $('#wzOvClose').click(); return; }
    if ($('#mcPanel')){ if (e.code === 'Escape') $('#mcPanel').remove(); return; }
    if (!G || view !== 'game' || e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
    if (['INPUT','TEXTAREA','SELECT','BUTTON'].includes(document.activeElement?.tagName)) return;   // a focused button handles the key itself
    if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowLeft'){ e.preventDefault(); if (G.phase !== 'final') next(); }
  });
  addEventListener('beforeunload', e => { if (wheelBusy || (G && ['question','reveal','board'].includes(G.phase))){ e.preventDefault(); e.returnValue = ''; } });

  setNet('wait'); $('#netTxt').textContent = 'غير متصل بعد';
  renderSetup();
}

/* ================= PLAYER ================= */
function playerMain(){
  const key = 'qms_me_' + ROOM + (LOCAL_TEST ? (params.get('pid')||'') : '');
  let me = sget(key, null);
  if (!me || typeof me.id !== 'string') me = {id:rid(12), s:'', g:''};      // {id, s, g}
  sset(key, me);
  const LAST_KEY = 'qms_me_last';         // the name used on this phone in earlier rounds (rooms change, the name should not)
  let S = null;                           // last state
  let net = null, T = PREFIX + ROOM;
  let myAns = sget(key + '_ans', {});     // seq -> option (for the current game only)
  let myGid = sget(key + '_gid', '');
  let qTimer = null, joinTimer = null, resendT = null, localEnd = 0, lastSeq = -1, editing = false;
  let mcount = 1;                         // names asked on this phone (1 or 2): set by the organiser, not by the participant
  function applyMembers(){
    if (!$('#gWrap')) return;
    mcount = S && S.mm === '2' ? 2 : 1;
    $('#gWrap').classList.toggle('hidden', mcount !== 2);
    $('#sLbl').textContent = mcount === 2 ? 'اسم العضو الأول' : 'اسم المشارك';
    const ready = !!(S && S.phase), btn = $('#joinBtn');      // wait for the organiser's settings before allowing the join
    btn.disabled = !ready; btn.textContent = ready ? 'انضمام' : 'جارٍ الاتصال بالمسابقة…';
  }

  function renderJoin(){
    editing = true;
    const last = LOCAL_TEST && params.get('pid') && !params.get('keep') ? null : sget(LAST_KEY, null);
    const pre = !me.s && last && last.s ? last : null;
    app.innerHTML = `
      <div class="phone"><div class="panel">
        <h2 class="kufi">أهلًا بكم في المسابقة 🌙</h2>
        <p class="sub">اكتب الاسم كما تريد ظهوره على الشاشة، ثم اضغط «انضمام».</p>
        ${pre ? `<div class="resume" style="font-size:14px;line-height:1.7">هذا اسمكم من الجولة السابقة. أبقوه كما هو لتُجمع نقاطكم مع الجولات السابقة.</div>` : ''}
        <div class="err hidden" id="joinErr"></div>
        <label class="f"><span id="sLbl">اسم المشارك</span><input id="sIn" maxlength="30" autocomplete="off" value="${esc(me.s || pre?.s || '')}"></label>
        <label class="f" id="gWrap">اسم العضو الثاني<input id="gIn" maxlength="30" autocomplete="off" value="${esc(me.s ? (me.g||'') : (pre?.g || ''))}"></label>
        <button class="btn" id="joinBtn">انضمام</button>
      </div></div>`;
    const go = () => {
      const s = $('#sIn').value.trim(), g = mcount === 2 ? $('#gIn').value.trim() : '';
      const fail = (msg, sel) => { const e = $('#joinErr'); e.textContent = msg; e.classList.remove('hidden'); $(sel).focus(); };
      if (!s) return fail('فضلًا اكتب الاسم أولًا.', '#sIn');
      if (mcount === 2 && !g) return fail('فضلًا اكتب اسم العضو الثاني.', '#gIn');
      me = {id: me.id, s, g}; sset(key, me); sset(LAST_KEY, {s, g});
      editing = false; sendJoin(); render();
    };
    applyMembers();
    $('#joinBtn').onclick = go;
    $('#gIn').onkeydown = $('#sIn').onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); go(); } };
  }
  function sendJoin(){ if (net && me.s) net.publish(T + '/p', JSON.stringify({t:'join', id:me.id, s:me.s, g:me.g})); }
  function joined(){ return S && S.n && S.n[me.id] !== undefined; }
  function ensureJoined(){
    clearInterval(joinTimer);
    joinTimer = setInterval(() => { if (me.s && !editing && S && S.phase !== 'closed' && S.phase !== 'final' && !joined() && !(S.rm||[]).includes(me.id)) sendJoin(); }, 3000);
  }

  function onMsg(topic, payload){
    if (topic !== T + '/s') return;
    if (!payload){ S = {phase:'closed'}; render(); return; }
    let st; try { st = JSON.parse(payload); } catch(e){ return; }
    if (!st || typeof st !== 'object') return;
    S = st;
    if (S.gid && S.gid !== myGid){          // a new game started in this room: forget answers of the previous one
      myGid = S.gid; myAns = {}; lastSeq = -1; sset(key + '_gid', myGid); sset(key + '_ans', myAns);
    }
    if (S.phase === 'question'){
      const end = Date.now() + (S.left ?? S.time*1000) - 300;
      if (S.seq !== lastSeq){ lastSeq = S.seq; localEnd = end; }
      else localEnd = Math.min(localEnd, end);       // later updates carry a fresher remaining time
    }
    render();
  }

  const screen = (emoji, title, body) => { app.innerHTML = `<div class="phone"><div class="center"><div class="big-emoji">${emoji}</div><h2>${title}</h2>${body||''}</div></div>`; };
  function tagHtml(){ return me.s ? `<div class="tagname">${esc(me.s)}${me.g ? `<small>مع ${esc(me.g)}</small>` : ''}</div>` : ''; }
  function render(){
    clearInterval(qTimer); clearTimeout(resendT);
    if (S && S.title) setBrand(S.title, S.sub, S.week);
    if (S && (S.rm||[]).includes(me.id)){ editing = false; screen('🚫', 'تمت إزالة هذا الفريق', '<p>تواصلوا مع المشرف إن كان ذلك بالخطأ.</p>'); return; }
    if (S && S.phase === 'closed'){ editing = false; screen('🌙', 'انتهت المسابقة', '<p>شكرًا لمشاركتكم، بارك الله فيكم.</p>'); return; }
    if (!me.s || editing){ if (!$('#sIn')) renderJoin(); else applyMembers(); return; }       // keep the form as is while the person is typing
    if (!S){ screen('⏳', 'جارٍ الاتصال بالمسابقة…', `<p>تأكدوا من اتصال الهاتف بالإنترنت.</p>${tagHtml()}`); return; }
    if (!joined()){
      if (S.phase === 'final'){ screen('🏁', 'انتهت هذه المسابقة', '<p>أُعلنت النتائج على الشاشة الكبيرة.</p>'); return; }
      screen('📡', 'جارٍ تسجيل فريقكم…', `${tagHtml()}<button class="btn ghost sm" id="editBtn" style="width:auto;margin-top:10px">تعديل الأسماء</button>`);
      $('#editBtn').onclick = () => renderJoin();
      return;
    }
    if (S.phase === 'lobby'){
      screen('✅', 'تم تسجيلكم!', `${tagHtml()}<p>انظروا إلى الشاشة الكبيرة.<br>ستبدأ المسابقة بعد قليل…</p><p style="font-size:14px">عدد الفرق: ${toAr(Object.keys(S.n).length)}${S.total ? ' · عدد الأسئلة: ' + toAr(S.total) : ''}</p><button class="btn ghost sm" id="editBtn" style="width:auto">تعديل الأسماء</button>`);
      $('#editBtn').onclick = () => renderJoin();
      return;
    }
    if (S.phase === 'question'){
      const opts = S.options || [];
      const mine = myAns[S.seq];
      const sentAck = (S.answered||[]).includes(me.id);
      if (mine !== undefined || sentAck){
        screen(sentAck ? '📨' : '⏳', sentAck ? 'وصلت إجابتكم' : 'جارٍ إرسال الإجابة…', `${mine!==undefined ? `<div class="pbtn c${mine}" style="width:100%;pointer-events:none"><span class="shape">${SHAPES[mine]}</span>${esc(opts[mine])}</div>` : ''}<p>انتظروا إعلان الإجابة الصحيحة على الشاشة</p>`);
        if (mine !== undefined && !sentAck) resendT = setTimeout(() => { if (S && S.phase==='question' && !(S.answered||[]).includes(me.id)) sendAnswer(mine, true); }, 2500);
        return;
      }
      if (localEnd - Date.now() <= 0){ screen('⌛', 'انتهى الوقت', '<p>انظروا إلى الشاشة لمعرفة الإجابة</p>'); return; }
      app.innerHTML = `
        <div class="phone">
          <div class="pmeta"><span>السؤال ${toAr(S.qi+1)} من ${toAr(S.total)}${S.cat ? ' · ' + esc(S.cat) : ''}</span><span class="t" id="pt"></span></div>
          <div class="pq">${esc(S.text)}</div>
          <div class="pbtns">${opts.map((o, j) => `<button class="pbtn c${j}" data-a="${j}"><span class="shape">${SHAPES[j]}</span><span>${esc(o)}</span></button>`).join('')}</div>
        </div>`;
      document.querySelectorAll('.pbtn').forEach(b => b.onclick = () => sendAnswer(+b.dataset.a));
      const upd = () => { const left = Math.max(0, localEnd - Date.now()); const el = $('#pt'); if (el) el.textContent = toAr(Math.ceil(left/1000)); if (left <= 0){ clearInterval(qTimer); screen('⌛', 'انتهى الوقت', '<p>انظروا إلى الشاشة لمعرفة الإجابة</p>'); } };
      upd(); qTimer = setInterval(upd, 250);
      return;
    }
    if (S.phase === 'reveal' || S.phase === 'board'){
      const r = (S.res||{})[me.id];
      if (!r){ screen('⏳', 'استعدوا للسؤال التالي…', tagHtml()); return; }
      const [c, pts, score, rank, a] = r;
      const cls = c===1 ? 'ok' : c===0 && a>=0 ? 'bad' : 'none';
      const lastQ = S.qi + 1 >= S.total;
      app.innerHTML = `
        <div class="phone"><div class="center">
          <div class="result ${cls}">
            <div class="big-emoji">${c===1 ? '🎉' : a>=0 ? '😔' : '⌛'}</div>
            <h2>${c===1 ? 'إجابة صحيحة!' : a>=0 ? 'إجابة خاطئة' : 'لم تُرسَل إجابة'}</h2>
            ${c===1 ? `<div class="gain">+${toAr(pts)} نقطة</div>` : `<p style="color:#fff;margin-top:8px">الإجابة الصحيحة: ${esc(S.options?.[S.correct]||'')}</p>`}
          </div>
          <div class="stats"><div class="stat"><b>${toAr(score)}</b><span>مجموع النقاط</span></div><div class="stat"><b>${toAr(rank)}</b><span>الترتيب من ${toAr(S.np||Object.keys(S.n).length)}</span></div></div>
          <p>${lastQ ? 'انتظروا إعلان الفائزين…' : 'استعدوا للسؤال التالي…'}</p>
        </div></div>`;
      return;
    }
    if (S.phase === 'final'){
      const r = (S.res||{})[me.id];
      if (!r){ screen('🏁', 'انتهت المسابقة', '<p>شكرًا لمشاركتكم، بارك الله فيكم.</p>'); return; }
      const rank = r[3], score = r[2];
      const nWin = Math.max(1, +S.win || 3), won = rank <= nWin;
      const medal = !won ? '🌟' : rank===1 ? '🥇' : rank===2 ? '🥈' : rank===3 ? '🥉' : '🏅';
      app.innerHTML = `
        <div class="phone"><div class="center">
          <div class="big-emoji">${medal}</div>
          <h2>${won ? 'مبارك! أنتم من الفائزين' : 'أحسنتم! بارك الله فيكم'}</h2>
          ${tagHtml()}
          <div class="stats"><div class="stat"><b>${toAr(rank)}</b><span>الترتيب النهائي</span></div><div class="stat"><b>${toAr(score)}</b><span>مجموع النقاط</span></div></div>
          <p>شكرًا لمشاركتكم في ${esc(S.title || 'المسابقة')} 🌙</p>
        </div></div>`;
    }
  }
  function sendAnswer(a, resend){
    if (!S || S.phase !== 'question' || !net) return;
    if (!resend && myAns[S.seq] !== undefined) return;
    myAns[S.seq] = a; sset(key + '_ans', myAns);
    net.publish(T + '/p', JSON.stringify({t:'ans', id:me.id, q:S.qi, a, g:S.gid}));
    if (!resend){ try { navigator.vibrate?.(40); } catch(e){} }
    render();
  }

  /* keep the phone screen awake during the competition (where supported) */
  const keepAwake = async () => { try { await navigator.wakeLock?.request('screen'); } catch(e){} };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
  keepAwake();

  render();
  connectTransport(onMsg).then(n => {
    net = n; net.subscribe(T + '/s');
    net.onConnect(() => { if (me.s && !editing) sendJoin(); else net.publish(T + '/p', JSON.stringify({t:'join', id:me.id, s:'', g:''})); });   // empty name = just ask the presenter's screen for the current state
    ensureJoined();
  }).catch(e => { setNet('off'); screen('⚠️', 'تعذّر الاتصال', `<p>${e && e.message && /[؀-ۿ]/.test(e.message) ? esc(e.message) : 'تأكدوا من اتصال الهاتف بالإنترنت ثم أعيدوا فتح الرابط.'}</p>`); });
}

/* ================= PRESENTER (remote screen on the presenter's phone) ================= */
function mcMain(){
  const MCK = (params.get('mc') || '').replace(/[^A-Z0-9]/gi,'');
  const key = 'qms_mc_' + ROOM + '_' + MCK;
  let me = sget(key, null); if (!me || typeof me.id !== 'string') me = {id:rid(12), name:''};
  sset(key, me);
  let S = null, net = null, T = PREFIX + ROOM, localEnd = 0, lastSeq = -1, timer = null, editing = false, sent = '', sentT = null;
  const screen = (emoji, title, body) => { app.innerHTML = `<div class="phone"><div class="center"><div class="big-emoji">${emoji}</div><h2>${title}</h2>${body||''}</div></div>`; };
  const claim = () => { if (net) net.publish(T + '/p', JSON.stringify({t:'mc', id:me.id, k:MCK, name:me.name})); };
  const cmd = a => {
    if (!net || !S) return;
    net.publish(T + '/p', JSON.stringify({t:'mcx', id:me.id, k:MCK, a, ph:S.phase, qi:S.qi}));
    if (a === 'next'){ sent = S.phase + ':' + S.qi; clearTimeout(sentT); sentT = setTimeout(() => { sent = ''; render(); }, 2500); render(); }
    try { navigator.vibrate?.(30); } catch(e){}
  };
  function renderForm(){
    editing = true;
    app.innerHTML = `
      <div class="phone"><div class="panel">
        <h2 class="kufi">شاشة مقدّم المسابقة 🎤</h2>
        <p class="sub">اكتب اسمك لتتحكم في سير المسابقة من هذا الهاتف. هذا الرمز يقبل مقدّمًا واحدًا فقط.</p>
        <div class="err hidden" id="mcErr">فضلًا اكتب اسمك أولًا.</div>
        <label class="f">اسم المقدّم<input id="mcName" maxlength="30" autocomplete="off" value="${esc(me.name)}"></label>
        <button class="btn" id="mcGo">دخول</button>
      </div></div>`;
    const go = () => { const n = $('#mcName').value.trim(); if (!n){ $('#mcErr').classList.remove('hidden'); $('#mcName').focus(); return; } me.name = n; sset(key, me); editing = false; claim(); render(); };
    $('#mcGo').onclick = go; $('#mcName').onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); go(); } };
  }
  function onMsg(topic, payload){
    if (topic !== T + '/m' + MCK) return;
    let st; try { st = JSON.parse(payload); } catch(e){ return; }
    if (!st || typeof st !== 'object') return;
    S = st;
    if (S.phase === 'question'){
      const end = Date.now() + (S.left ?? S.time*1000);
      if (S.seq !== lastSeq){ lastSeq = S.seq; localEnd = end; } else localEnd = Math.min(localEnd, end);
    }
    if (sent && sent !== S.phase + ':' + S.qi) sent = '';
    render();
  }
  function render(){
    clearInterval(timer);
    if (S && S.title) setBrand(S.title, S.sub, 'شاشة المقدّم');
    if (S && S.phase === 'closed'){ editing = false; screen('🌙', 'أُغلقت هذه الغرفة', '<p>انتهت المسابقة أو أُلغي رمز المقدّم. اطلب رمزًا جديدًا من مسؤول المسابقة عند الحاجة.</p>'); return; }
    if (S && S.mc && S.mc.id !== me.id){ editing = false; screen('🔒', 'الرمز مستخدَم', `<p>دخل بهذا الرمز مقدّم آخر${S.mc.name ? ' (' + esc(S.mc.name) + ')' : ''}، وهو يقبل مقدّمًا واحدًا فقط.<br>اطلب من مسؤول المسابقة إنشاء رمز جديد.</p>`); return; }
    if (!me.name || editing){ if (!$('#mcName')) renderForm(); return; }
    if (!S){ screen('⏳', 'جارٍ الاتصال بالمسابقة…', '<p>تأكد من اتصال الهاتف بالإنترنت.</p>'); return; }
    if (!S.mc){ screen('📡', 'جارٍ تسجيلك مقدّمًا…', `<div class="tagname">${esc(me.name)}</div>`); return; }
    if (S.wheel){                                               // the wheel is on the big screen: drive it from here
      const w = S.wheel;
      app.innerHTML = `<div class="phone mc"><div class="mc-head"><span>🎤 ${esc(S.mc.name)}</span><span>🎡 دولاب الجوائز</span></div>
        ${w.last ? `<div class="result ok" style="text-align:center"><p style="color:#fff">الفائز في السحب على ${esc(w.last.prize)}</p><h2 style="font-size:44px;margin:8px 0">${esc(w.last.value)}</h2></div><div style="height:12px"></div><button class="btn mc-next" id="mcWok">متابعة</button>`
          : `<div class="center" style="flex:0;padding:10px 0"><div class="big-emoji">🎡</div><h2>${w.done ? 'انتهى السحب' : esc(w.prize)}</h2><p>${w.done ? 'مبارك للفائزين' : `السحب التالي · المتبقي ${toAr(w.left)} من ${toAr(w.total)}`}<br>عدد المشاركين في الدولاب: ${toAr(w.pool)}</p></div>
             <button class="btn mc-next" id="mcSpin" ${w.spinning || w.done || !w.pool ? 'disabled' : ''}>${w.spinning ? 'يدور…' : 'أدِر الدولاب'}</button>`}
        ${w.winners.length ? `<div class="rows" style="margin-top:14px">${w.winners.map((x, i) => `<div class="row" style="font-size:16px;padding:9px 14px"><span class="rk" style="width:34px;height:34px">${toAr(i+1)}</span><span class="nm">${esc(x[1])}<small>${esc(x[0])}</small></span></div>`).join('')}</div>` : ''}
        <button class="btn ghost sm mc-pause" id="mcWback" ${w.spinning ? 'disabled' : ''}>→ العودة إلى المسابقة</button>
        ${!w.pool && !w.done ? '<p class="mc-note">الدولاب فارغ: يضيف المسؤول المشاركين من «الإعدادات» على شاشة العرض.</p>' : ''}</div>`;
      if ($('#mcSpin')) $('#mcSpin').onclick = () => { $('#mcSpin').disabled = true; cmd('wspin'); };
      if ($('#mcWok')) $('#mcWok').onclick = () => cmd('wok');
      $('#mcWback').onclick = () => cmd('wback');
      return;
    }
    const wheelBtn = '<button class="btn ghost sm mc-pause" id="mcWheel">🎡 دولاب جوائز الحضور</button>';
    const busy = sent === S.phase + ':' + S.qi;
    const head = `<div class="mc-head"><span>🎤 ${esc(S.mc.name)}</span><span>${esc(S.week||'')}</span></div>`;
    const nextBtn = label => `<button class="btn mc-next" id="mcNext" ${busy ? 'disabled' : ''}>${busy ? 'جارٍ التنفيذ…' : label}</button>`;
    const opts = (S.options||[]).map((o, j) => `<div class="pbtn c${j} mc-opt ${j === S.correct ? 'right' : ''}"><span class="shape">${SHAPES[j]}</span><span style="flex:1">${esc(o)}</span>${j === S.correct ? '<b class="mc-ok">✓ الصحيحة</b>' : ''}${S.counts ? `<span class="mc-cnt">${toAr(S.counts[j])}</span>` : ''}</div>`).join('');
    let body = '';
    if (S.phase === 'lobby'){
      body = `<div class="center" style="flex:0;padding:10px 0"><div class="big-emoji">👥</div><h2>${toAr(S.np)} فريق انضم</h2><p>عدد الأسئلة: ${toAr(S.total)}. اضغط البدء عندما يكتمل الحضور.</p></div>${S.np ? nextBtn('ابدأ المسابقة ←') : '<p class="mc-note">بانتظار انضمام أول فريق…</p>'}${wheelBtn}`;
    } else if (S.phase === 'question' || S.phase === 'reveal'){
      const rev = S.phase === 'reveal';
      body = `<div class="pmeta"><span>السؤال ${toAr(S.qi+1)} من ${toAr(S.total)}${S.cat ? ' · ' + esc(S.cat) : ''}</span>${rev ? '<span class="t">كُشفت الإجابة</span>' : '<span class="t" id="mcT"></span>'}</div>
        <div class="pq">${esc(S.text)}</div><div class="pbtns" style="flex:0">${opts}</div>
        <div class="stats" style="margin:12px 0"><div class="stat"><b>${toAr(S.ans)}</b><span>أجابوا من ${toAr(S.np)}</span></div>${rev ? `<div class="stat"><b>${toAr(S.counts ? S.counts[S.correct] : 0)}</b><span>إجابة صحيحة</span></div>` : ''}</div>
        ${nextBtn(rev ? 'لوحة الصدارة ←' : 'إظهار الإجابة الآن')}${rev && S.auto ? '<button class="btn ghost sm mc-pause" id="mcPause">⏸ إيقاف الانتقال التلقائي</button>' : ''}`;
    } else if (S.phase === 'board' || S.phase === 'final'){
      const fin = S.phase === 'final', last = S.qi + 1 >= S.total;
      body = `<h2 class="kufi" style="text-align:center;margin:8px 0 10px">${fin ? '🏆 الفائزون' : 'لوحة الصدارة'}</h2>
        <div class="rows">${(S.top||[]).map((p, i) => `<div class="row" style="font-size:17px;padding:10px 14px"><span class="rk" style="width:36px;height:36px">${toAr(i+1)}</span><span class="nm">${esc(p[0])}</span><span class="sc" style="font-size:20px">${toAr(p[1])}</span></div>`).join('') || '<p class="mc-note">لا توجد فرق</p>'}</div>
        <div style="height:12px"></div>${fin ? wheelBtn + '<p class="mc-note">انتهت الجولة. التتويج بمجموع الجولات يُعرض من شاشة العرض.</p>' : nextBtn(last ? 'إعلان الفائزين 🏆' : 'السؤال التالي ←') + (S.auto ? '<button class="btn ghost sm mc-pause" id="mcPause">⏸ إيقاف الانتقال التلقائي</button>' : '')}`;
    }
    app.innerHTML = `<div class="phone mc">${head}${body}</div>`;
    if ($('#mcNext')) $('#mcNext').onclick = () => cmd('next');
    if ($('#mcWheel')) $('#mcWheel').onclick = () => cmd('wopen');
    if ($('#mcPause')) $('#mcPause').onclick = () => { cmd('pause'); $('#mcPause').remove(); };
    if ($('#mcT')){ const upd = () => { const el = $('#mcT'); if (el) el.textContent = toAr(Math.ceil(Math.max(0, localEnd - Date.now())/1000)); }; upd(); timer = setInterval(upd, 250); }
  }
  const keepAwake = async () => { try { await navigator.wakeLock?.request('screen'); } catch(e){} };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
  keepAwake();
  render();
  connectTransport(onMsg).then(n => {
    net = n; net.subscribe(T + '/m' + MCK);
    net.onConnect(claim);                                   // with no name yet this only asks the big screen for the current state
    setInterval(() => { if (me.name && !editing && S && S.phase !== 'closed' && !S.mc) claim(); }, 3000);
  }).catch(e => { setNet('off'); screen('⚠️', 'تعذّر الاتصال', `<p>${e && e.message && /[؀-ۿ]/.test(e.message) ? esc(e.message) : 'تأكد من اتصال الهاتف بالإنترنت ثم أعد فتح الرابط.'}</p>`); });
}

/* ================= boot ================= */
if (ROOM && !IS_HOST && params.get('mc')) mcMain();
else if (ROOM && !IS_HOST) playerMain();
else hostMain(loadScript(['https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js','https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js']).catch(()=>{}));
</script>
