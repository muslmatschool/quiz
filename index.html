<script>
/* ================= common ================= */
const params = new URLSearchParams(location.search);
const ROOM = (params.get('room') || '').replace(/[^A-Z0-9]/gi,'').toUpperCase();
const BROKERS = ['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt'];
const BROKER_IDX = Math.min(Math.max(parseInt(params.get('b')||'0',10)||0,0),BROKERS.length-1);
const BROKER_URL = params.get('broker') || BROKERS[BROKER_IDX];
const LOCAL_TEST = params.get('transport') === 'local';
const PREFIX = 'quranmuslmat-quiz-v1/';
const SHAPES = ['▲','◆','●','■'];
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sget = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e) { return d; } };
const sset = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} };
const sdel = k => { try { localStorage.removeItem(k); } catch(e) {} };
const rid = (n, chars) => { let s=''; const c = chars||'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; const a = new Uint32Array(n); crypto.getRandomValues(a); for (const x of a) s += c[x % c.length]; return s; };
const toAr = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);

function setNet(state){
  const d = $('#netDot'), t = $('#netTxt');
  d.className = 'dot ' + (state==='on' ? 'on' : state==='off' ? 'off' : '');
  t.textContent = state==='on' ? 'متصل' : state==='off' ? 'انقطع الاتصال… يعاد المحاولة' : 'جارٍ الاتصال…';
}

/* ---- transport: MQTT over WebSocket (public broker), or local BroadcastChannel for testing ---- */
function loadScript(srcs){
  return new Promise((res, rej) => {
    const tryNext = i => {
      if (i >= srcs.length) return rej(new Error('load failed'));
      const s = document.createElement('script'); s.src = srcs[i];
      s.onload = () => res(); s.onerror = () => { s.remove(); tryNext(i+1); };
      document.head.appendChild(s);
    };
    tryNext(0);
  });
}
async function connectTransport(onMsg){
  if (LOCAL_TEST){
    const bc = new BroadcastChannel('quiz-local');
    const retained = sget('__retained', {});
    const deliver = (topic, payload) => { if (subs.some(p => topic === p)) onMsg(topic, payload); };
    const subs = [];
    bc.onmessage = e => deliver(e.data.topic, e.data.payload);
    setTimeout(() => setNet('on'), 50);
    return {
      subscribe(topic){ subs.push(topic); const r = sget('__retained', {}); if (r[topic]) setTimeout(() => onMsg(topic, r[topic]), 10); },
      publish(topic, payload, retain){
        if (retain){ const r = sget('__retained', {}); if (payload) r[topic] = payload; else delete r[topic]; sset('__retained', r); }
        bc.postMessage({topic, payload});
        if (subs.includes(topic)) setTimeout(() => onMsg(topic, payload), 0);
      },
      onConnect(fn){ setTimeout(fn, 60); }
    };
  }
  await loadScript(['https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js','https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js']);
  const client = mqtt.connect(BROKER_URL, {
    clientId: 'qms_' + rid(10), clean: true, keepalive: 30, reconnectPeriod: 2000, connectTimeout: 10000
  });
  const subs = new Set();
  const connectFns = [];
  client.on('connect', () => { setNet('on'); subs.forEach(t => client.subscribe(t, {qos:1})); connectFns.forEach(f => f()); });
  client.on('reconnect', () => setNet('wait'));
  client.on('offline', () => setNet('off'));
  client.on('close', () => setNet('off'));
  client.on('error', () => setNet('off'));
  client.on('message', (topic, buf) => onMsg(topic, buf.toString()));
  return {
    subscribe(topic){ subs.add(topic); if (client.connected) client.subscribe(topic, {qos:1}); },
    publish(topic, payload, retain){ client.publish(topic, payload, {qos:1, retain: !!retain}); },
    onConnect(fn){ connectFns.push(fn); if (client.connected) fn(); }
  };
}

/* ---- default questions ---- */
const DEFAULT_QUESTIONS = [
  {text:'ما أطول سورة في القرآن الكريم؟', options:['سورة البقرة','سورة آل عمران','سورة النساء','سورة الكهف'], correct:0, time:20},
  {text:'كم عدد سور القرآن الكريم؟', options:['١١٠ سور','١١٤ سورة','١٢٠ سورة','٩٩ سورة'], correct:1, time:20},
  {text:'ما أقصر سورة في القرآن الكريم؟', options:['سورة العصر','سورة النصر','سورة الكوثر','سورة الإخلاص'], correct:2, time:20},
  {text:'كم عدد أجزاء القرآن الكريم؟', options:['٤٠ جزءًا','٦٠ جزءًا','١١٤ جزءًا','٣٠ جزءًا'], correct:3, time:15},
  {text:'في أيّ شهر نزل القرآن الكريم؟', options:['رمضان','شعبان','رجب','ذو الحجة'], correct:0, time:15},
  {text:'ما أول ما نزل من القرآن الكريم؟', options:['سورة الفاتحة','﴿اقرأ باسم ربك الذي خلق﴾','سورة المدثر','آية الكرسي'], correct:1, time:20},
  {text:'ما السورة التي لا تبدأ بالبسملة؟', options:['سورة الأنفال','سورة الملك','سورة التوبة','سورة يس'], correct:2, time:20},
  {text:'ما السورة التي ذُكرت فيها البسملة مرتين؟', options:['سورة الفاتحة','سورة هود','سورة التوبة','سورة النمل'], correct:3, time:25},
  {text:'في أيّ سورة تقع آية الكرسي؟', options:['سورة البقرة','سورة آل عمران','سورة الكهف','سورة يس'], correct:0, time:20},

/* ================= HOST ================= */
function hostMain(){
  $('#fsBtn').classList.remove('hidden');
  $('#fsBtn').onclick = () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); };

  let cfg = sget('qms_cfg', {title:'المسابقة الثقافية', questions: DEFAULT_QUESTIONS});
  if (!Array.isArray(cfg.questions) || !cfg.questions.length) cfg.questions = JSON.parse(JSON.stringify(DEFAULT_QUESTIONS));
  let G = null;           // live game
  let net = null, T = '';
  let tick = null, pubTimer = null, autoT = null;
  if (cfg.auto === undefined) cfg.auto = 6;
  const saveCfg = () => sset('qms_cfg', cfg);
  const saveGame = () => G && sset('qms_game', G);
  $('#brandTitle').textContent = cfg.title || 'المسابقة الثقافية';

  /* ---------- setup screen ---------- */
  function renderSetup(){
    clearInterval(tick);
    const saved = sget('qms_game', null);
    const isFile = location.protocol === 'file:';
    app.innerHTML = `
      <div class="wrap">
        <div class="setup-head">
          <div><h2 class="kufi">إعداد المسابقة</h2><p>راجع الأسئلة وعدّلها، ثم افتح غرفة المسابقة ليمسح كل فريق رمز QR بهاتفه.</p></div>
          <button class="btn" id="openRoom">افتح غرفة المسابقة ←</button>
        </div>
        <div class="panel">
          ${isFile ? `<div class="warn"><b>تنبيه:</b> الصفحة مفتوحة من ملف على هذا الجهاز، والهواتف لن تستطيع فتح رابطها. ارفع الملف على موقع المدرسة (أو أي استضافة) وافتحه من هناك يوم المسابقة. يمكنك الآن تجهيز الأسئلة فقط.</div>` : ''}
          ${saved && ['question','reveal','board'].includes(saved.phase) ? `<div class="resume"><span>توجد مسابقة جارية لم تكتمل (${toAr(Object.keys(saved.players||{}).length)} فريق، السؤال ${toAr((saved.qi||0)+1)}).</span><span class="sp"></span><button class="btn sm" id="resumeBtn">استئناف المسابقة</button><button class="btn ghost sm" style="color:#1d5c3e" id="dropBtn">تجاهل</button></div>` : ''}
          <div class="fields">
            <label class="f">عنوان المسابقة<input id="titleIn" value="${esc(cfg.title)}"></label>
            <label class="f">تطبيق مدة موحّدة على كل الأسئلة
              <select id="allTime"><option value="">— اختر —</option>${[10,15,20,25,30,45,60].map(s=>`<option value="${s}">${toAr(s)} ثانية</option>`).join('')}</select>
            </label>
            <label class="f">الانتقال بعد كشف الإجابة
              <select id="autoSel">${[[0,'يدوي (بالضغط على زر)'],[4,'تلقائي بعد ٤ ثوانٍ'],[6,'تلقائي بعد ٦ ثوانٍ'],[8,'تلقائي بعد ٨ ثوانٍ'],[10,'تلقائي بعد ١٠ ثوانٍ']].map(([v,t])=>`<option value="${v}" ${+cfg.auto===v?'selected':''}>${t}</option>`).join('')}</select>
            </label>
          </div>
          <div class="qlist" id="qlist"></div>
          <div class="setup-actions">
            <button class="btn sm" id="addQ">+ إضافة سؤال</button>
            <span class="sp"></span>
            <button class="mini" id="exportQ">حفظ الأسئلة في ملف</button>
            <button class="mini" id="importQ">استيراد أسئلة من ملف</button>
            <button class="mini del" id="resetQ">استعادة الأسئلة الافتراضية</button>
            <input type="file" id="fileIn" accept=".json" class="hidden">
          </div>
          <p class="hint" style="margin-top:10px">يتم حفظ تعديلاتك تلقائيًا على هذا الجهاز. اختر الإجابة الصحيحة بالدائرة بجانبها. النقاط: الإجابة الصحيحة تمنح من ٥٠٠ إلى ١٠٠٠ نقطة حسب سرعة الإجابة، والخاطئة صفر.</p>
        </div>
      </div>`;
    renderQList();
    $('#titleIn').oninput = e => { cfg.title = e.target.value; $('#brandTitle').textContent = cfg.title || 'المسابقة الثقافية'; saveCfg(); };
    $('#allTime').onchange = e => { const v = +e.target.value; if (!v) return; cfg.questions.forEach(q => q.time = v); saveCfg(); renderQList(); e.target.value=''; };
    $('#autoSel').onchange = e => { cfg.auto = +e.target.value; saveCfg(); };
    $('#addQ').onclick = () => { cfg.questions.push({text:'', options:['','','',''], correct:0, time:20}); saveCfg(); renderQList(); const t = document.querySelectorAll('.qcard textarea'); t[t.length-1]?.focus(); };
    $('#resetQ').onclick = () => { if (confirm('استبدال كل الأسئلة الحالية بالأسئلة الافتراضية؟')) { cfg.questions = JSON.parse(JSON.stringify(DEFAULT_QUESTIONS)); saveCfg(); renderQList(); } };
    $('#exportQ').onclick = () => {
      const blob = new Blob([JSON.stringify(cfg, null, 2)], {type:'application/json'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'أسئلة-المسابقة.json'; a.click();
    };
    $('#importQ').onclick = () => $('#fileIn').click();
    $('#fileIn').onchange = async e => {
      try {
        const data = JSON.parse(await e.target.files[0].text());
        const qs = Array.isArray(data) ? data : data.questions;
        if (!Array.isArray(qs) || !qs.length) throw 0;
        cfg.questions = qs.map(q => ({text: String(q.text||''), options: [0,1,2,3].map(i => String((q.options||[])[i]||'')), correct: Math.min(3,Math.max(0,+q.correct||0)), time: +q.time||20}));
        if (data.title) cfg.title = data.title;
        saveCfg(); renderSetup();
      } catch(err){ alert('تعذّر قراءة الملف. تأكد أنه ملف أسئلة محفوظ من هذه الصفحة.'); }
    };
    $('#openRoom').onclick = openRoom;
    if ($('#resumeBtn')) $('#resumeBtn').onclick = () => { G = saved; startNet().then(() => { renderPhase(); if (G.phase==='question') resumeTimer(); }); };
    if ($('#dropBtn')) $('#dropBtn').onclick = () => { sdel('qms_game'); renderSetup(); };
  }

  function renderQList(){
    const el = $('#qlist');
    el.innerHTML = cfg.questions.map((q, i) => `
      <div class="qcard" data-i="${i}">
        <div class="qcard-head">
          <span class="qnum">${toAr(i+1)}</span>
          <span class="sp"></span>
          <button class="mini" data-act="up" ${i===0?'disabled':''}>▲</button>
          <button class="mini" data-act="down" ${i===cfg.questions.length-1?'disabled':''}>▼</button>
          <button class="mini del" data-act="del">حذف</button>
        </div>
        <textarea data-f="text" placeholder="اكتب نص السؤال">${esc(q.text)}</textarea>
        <div class="opts-edit">
          ${q.options.map((o, j) => `
            <label class="opt-edit ${q.correct===j?'correct':''}">
              <span class="sw c${j}"></span>
              <input type="text" data-o="${j}" value="${esc(o)}" placeholder="الخيار ${toAr(j+1)}">
              <input type="radio" name="c${i}" data-c="${j}" ${q.correct===j?'checked':''} title="الإجابة الصحيحة">
            </label>`).join('')}
        </div>
        <div class="qcard-foot">مدة السؤال:
          <select data-f="time">${[10,15,20,25,30,45,60].map(s=>`<option value="${s}" ${+q.time===s?'selected':''}>${toAr(s)} ثانية</option>`).join('')}</select>
        </div>
      </div>`).join('');
    el.querySelectorAll('.qcard').forEach(card => {
      const i = +card.dataset.i, q = cfg.questions[i];
      card.querySelector('textarea').oninput = e => { q.text = e.target.value; saveCfg(); };
      card.querySelectorAll('[data-o]').forEach(inp => inp.oninput = e => { q.options[+inp.dataset.o] = e.target.value; saveCfg(); });
      card.querySelectorAll('[data-c]').forEach(r => r.onchange = () => { q.correct = +r.dataset.c; saveCfg(); card.querySelectorAll('.opt-edit').forEach((l, j) => l.classList.toggle('correct', j===q.correct)); });
      card.querySelector('[data-f=time]').onchange = e => { q.time = +e.target.value; saveCfg(); };
      card.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
        const a = b.dataset.act, qs = cfg.questions;
        if (a==='del'){ if (qs.length<=1) return alert('يجب أن تحتوي المسابقة على سؤال واحد على الأقل.'); if (!confirm('حذف هذا السؤال؟')) return; qs.splice(i,1); }
        if (a==='up' && i>0) [qs[i-1],qs[i]] = [qs[i],qs[i-1]];
        if (a==='down' && i<qs.length-1) [qs[i+1],qs[i]] = [qs[i],qs[i+1]];
        saveCfg(); renderQList();
      });
    });
  }

  function validQuestions(){
    const bad = cfg.questions.findIndex(q => !q.text.trim() || q.options.some(o => !o.trim()));
    if (bad >= 0){ alert(`السؤال رقم ${toAr(bad+1)} غير مكتمل: تأكد من كتابة نص السؤال والخيارات الأربعة.`); return false; }
    return true;
  }

  /* ---------- networking ---------- */
  async function startNet(){
    if (net) return;
    T = PREFIX + G.room;
    try {
      net = await connectTransport(onMsg);
    } catch(e){
      setNet('off'); alert('تعذّر تحميل مكتبة الاتصال. تأكد من اتصال الجهاز بالإنترنت ثم أعد تحميل الصفحة.'); throw e;
    }
    net.subscribe(T + '/p');
    net.onConnect(() => publishNow());
  }
  function onMsg(topic, payload){
    if (topic !== T + '/p' || !G) return;
    let m; try { m = JSON.parse(payload); } catch(e){ return; }
    if (!m || typeof m.id !== 'string' || m.id.length > 40) return;
    if (m.t === 'join'){
      const s = String(m.s||'').trim().slice(0,30), g = String(m.g||'').trim().slice(0,30);
      if (!s) return;
      if (G.removed && G.removed.includes(m.id)) return;
      if (!G.players[m.id]) G.players[m.id] = {s, g, score:0, time:0, last:null, prev:0};
      else { G.players[m.id].s = s; G.players[m.id].g = g; }
      saveGame(); schedulePublish();
      if (G.phase === 'lobby') renderTeams();
    } else if (m.t === 'ans'){
      if (G.phase !== 'question' || m.q !== G.qi || !G.players[m.id] || G.answers[m.id]) return;
      const a = +m.a; if (!(a>=0 && a<=3)) return;
      G.answers[m.id] = {a, ms: Math.max(0, Date.now() - G.qStart)};
      saveGame(); schedulePublish(); updateAnswered();
      if (Object.keys(G.answers).length >= Object.keys(G.players).length) setTimeout(() => { if (G.phase==='question') reveal(); }, 600);
    }
  }
  function schedulePublish(){ clearTimeout(pubTimer); pubTimer = setTimeout(publishNow, 200); }
  function namesMap(){ const n = {}; for (const [id,p] of Object.entries(G.players)) n[id] = p.s; return n; }
  function ranked(){
    return Object.entries(G.players).map(([id,p]) => ({id, ...p})).sort((a,b) => b.score - a.score || a.time - b.time);
  }
  function resMap(){
    const r = {}; ranked().forEach((p, i) => { r[p.id] = [p.last ? (p.last.c?1:0) : -1, p.last ? p.last.pts : 0, p.score, i+1, p.last ? p.last.a : -1]; });
    return r;
  }
  function publishNow(){
    if (!net || !G) return;
    const q = cfg.questions[G.qi] || null;
    const st = {v:1, phase:G.phase, title:cfg.title, n:namesMap(), total:G.qs.length, qi:G.qi, rm:G.removed||[]};
    if (G.phase === 'question'){ const qq = G.qs[G.qi]; Object.assign(st, {text:qq.text, options:qq.options, time:qq.time, seq:G.seq, left: Math.max(0, qq.time*1000 - (Date.now()-G.qStart)), answered:Object.keys(G.answers)}); }
    if (G.phase === 'reveal' || G.phase === 'board' || G.phase === 'final'){ const qq = G.qs[G.qi]; Object.assign(st, {text:qq?.text, options:qq?.options, correct:qq?.correct, res:resMap(), np:Object.keys(G.players).length}); }
    net.publish(T + '/s', JSON.stringify(st), true);
  }

  /* ---------- flow ---------- */
  async function openRoom(){
    if (!validQuestions()) return;
    if (location.protocol === 'file:' && !LOCAL_TEST){ if (!confirm('الصفحة مفتوحة من ملف محلي، ولن تتمكن الهواتف من الدخول. هل تريد المتابعة للتجربة فقط؟')) return; }
    sdel('qms_game');
    G = {room: rid(5), phase:'lobby', qi:-1, players:{}, answers:{}, qStart:0, seq:0, removed:[], qs: JSON.parse(JSON.stringify(cfg.questions))};
    saveGame();
    await startNet();
    renderPhase(); publishNow();
  }
  function joinUrl(){
    const u = new URL(location.href); u.search = ''; u.hash = '';
    u.searchParams.set('room', G.room);
    if (BROKER_IDX) u.searchParams.set('b', BROKER_IDX);
    if (params.get('broker')) u.searchParams.set('broker', params.get('broker'));
    if (LOCAL_TEST) u.searchParams.set('transport','local');
    return u.toString();
  }
  function startQuestion(i){
    G.qi = i; G.phase = 'question'; G.answers = {}; G.qStart = Date.now(); G.seq = (G.seq||0)+1;
    for (const p of Object.values(G.players)) { p.prev = p.score; p.last = null; }
    saveGame(); publishNow(); renderPhase(); resumeTimer();
  }
  function resumeTimer(){
    clearInterval(tick);
    const q = G.qs[G.qi];
    const upd = () => {
      const left = Math.max(0, q.time*1000 - (Date.now() - G.qStart));
      const sec = Math.ceil(left/1000);
      const num = $('#tnum'), ring = $('#tring');
      if (num) num.textContent = toAr(sec);
      if (ring) ring.style.strokeDashoffset = String(339.3 * (1 - left/(q.time*1000)));
      if (sec <= 5 && sec > 0 && num && num.dataset.s != sec){ num.dataset.s = sec; beep(660, .08); }
      if (left <= 0) reveal();
    };
    upd(); tick = setInterval(upd, 200);
  }
  function reveal(){
    if (G.phase !== 'question') return;
    clearInterval(tick);
    const q = G.qs[G.qi], dur = q.time*1000;
    for (const [id,p] of Object.entries(G.players)){
      const a = G.answers[id];
      if (a && a.a === q.correct){
        const pts = Math.round(1000 * (1 - Math.min(a.ms, dur)/dur/2));
        p.score += pts; p.time += a.ms; p.last = {c:true, pts, a:a.a};
      } else p.last = {c:false, pts:0, a: a ? a.a : -1};
    }
    G.phase = 'reveal'; saveGame(); publishNow(); renderPhase(); beep(880,.15); setTimeout(()=>beep(1175,.2),160);
  }
  function armAuto(label){
    clearInterval(autoT); autoT = null;
    const secs = +cfg.auto; if (!secs || !G) return;
    const ph = G.phase, qi = G.qi; let left = secs;
    const btn = $('#nextBtn'), pause = $('#pauseBtn');
    const show = () => { if (btn) btn.textContent = label + ' (' + toAr(left) + ')'; };
    if (pause){ pause.classList.remove('hidden'); pause.onclick = () => { clearInterval(autoT); autoT = null; if (btn) btn.textContent = label; pause.classList.add('hidden'); }; }
    show();
    autoT = setInterval(() => { if (!G || G.phase !== ph || G.qi !== qi){ clearInterval(autoT); return; } left--; if (left <= 0){ clearInterval(autoT); autoT = null; next(); } else show(); }, 1000);
  }
  function next(){
    clearInterval(autoT); autoT = null;
    if (G.phase === 'lobby'){ if (!Object.keys(G.players).length && !confirm('لم ينضم أي فريق بعد. هل تريد البدء؟')) return; startQuestion(0); }
    else if (G.phase === 'question') reveal();
    else if (G.phase === 'reveal'){ G.phase = 'board'; saveGame(); publishNow(); renderPhase(); }
    else if (G.phase === 'board'){ if (G.qi + 1 < G.qs.length) startQuestion(G.qi + 1); else { G.phase = 'final'; saveGame(); publishNow(); renderPhase(); } }
  }

  /* ---------- host renders ---------- */
  function renderPhase(){
    if (G.phase === 'lobby') renderLobby();
    else if (G.phase === 'question' || G.phase === 'reveal') renderQuestion();
    else if (G.phase === 'board') renderBoard();
    else if (G.phase === 'final') renderFinal();
  }
  function renderLobby(){
    const url = joinUrl();
    app.innerHTML = `
      <div class="wrap"><div class="lobby">
        <div class="panel joinbox">
          <h3>امسحوا الرمز بالهاتف للانضمام</h3>
          <div id="qr"></div>
          <div class="code">رمز الغرفة<b>${esc(G.room)}</b></div>
          <div class="joinurl">${esc(url)}</div>
        </div>
        <div>
          <div class="teams-head"><h3 class="kufi">الفرق المنضمّة</h3><span class="count" id="tcount">٠</span></div>
          <div class="teams" id="teams"></div>
          <div style="display:flex;gap:10px;margin-top:22px;flex-wrap:wrap">
            <button class="btn" id="startBtn">ابدأ المسابقة ←</button>
            <button class="btn ghost" id="cancelBtn">إلغاء والعودة للإعداد</button>
          </div>
          <p style="color:#cfe1da;margin-top:14px;line-height:1.8">كل فريق = الطالب/ة مع وليّ الأمر على هاتف واحد. يكتبون الاسمين ثم ينتظرون ظهور السؤال الأول.<br>يمكن للمقدّم الضغط على مفتاح المسافة للانتقال للخطوة التالية.</p>
        </div>
      </div></div>`;
    try {
      if (window.QRCode) new QRCode($('#qr'), {text:url, width:300, height:300, colorDark:'#0d3b2e', colorLight:'#ffffff', correctLevel:QRCode.CorrectLevel.M});
      else $('#qr').innerHTML = '<div style="width:300px;height:300px;display:grid;place-items:center;color:#5d6f68">تعذّر إنشاء رمز QR — استخدموا الرابط أدناه</div>';
    } catch(e){}
    renderTeams();
    $('#startBtn').onclick = next;
    $('#cancelBtn').onclick = () => { if (!confirm('إلغاء الغرفة الحالية؟')) return; endRoom(); };
  }
  function renderTeams(){
    const el = $('#teams'); if (!el) return;
    const list = Object.entries(G.players);
    $('#tcount').textContent = toAr(list.length);
    el.innerHTML = list.length ? list.map(([id,p]) => `<div class="team"><div><b>${esc(p.s)}</b><span>${p.g ? 'مع ' + esc(p.g) : ''}</span></div><button class="x" data-id="${esc(id)}" title="إزالة">×</button></div>`).join('')
      : '<div class="empty">بانتظار انضمام الفرق…</div>';
    el.querySelectorAll('.x').forEach(b => b.onclick = () => { const id = b.dataset.id; if (!confirm('إزالة هذا الفريق؟')) return; delete G.players[id]; G.removed.push(id); saveGame(); publishNow(); renderTeams(); });
  }
  function renderQuestion(){
    const q = G.qs[G.qi], isRev = G.phase === 'reveal';
    const counts = [0,0,0,0]; Object.values(G.answers).forEach(a => counts[a.a]++);
    app.innerHTML = `
      <div class="qscreen">
        <div class="qmeta"><span class="pill">السؤال ${toAr(G.qi+1)} من ${toAr(G.qs.length)}</span><span class="pill">${esc(cfg.title)}</span></div>
        <div class="qtext">${esc(q.text)}</div>
        <div class="qmid">
          ${isRev ? `<div class="answered"><b>${toAr(counts[q.correct])}</b><span>إجابة صحيحة</span></div>` : `
          <div class="timer"><svg width="120" height="120"><circle cx="60" cy="60" r="54" stroke="rgba(255,255,255,.15)" stroke-width="10" fill="none"/><circle id="tring" cx="60" cy="60" r="54" stroke="#d6a640" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="339.3" stroke-dashoffset="0" style="transition:stroke-dashoffset .2s linear"/></svg><div class="num" id="tnum"></div></div>`}
          <div class="answered"><b id="ansCount">${toAr(Object.keys(G.answers).length)}</b><span>أجاب من ${toAr(Object.keys(G.players).length)} فريق</span></div>
        </div>
        <div class="otiles">
          ${q.options.map((o, j) => `<div class="otile c${j} ${isRev ? (j===q.correct?'win':'dim') : ''}"><span class="shape">${SHAPES[j]}</span><span class="ttl">${esc(o)}</span>${isRev?`<span class="cnt">${toAr(counts[j])}</span>`:''}</div>`).join('')}
        </div>
        <div class="qfoot">${isRev ? `<button class="btn ghost hidden" id="pauseBtn">⏸ إيقاف مؤقت</button><button class="btn" id="nextBtn">لوحة الصدارة ←</button>` : `<button class="btn ghost" id="nextBtn">إظهار الإجابة الآن</button>`}</div>
      </div>`;
    $('#nextBtn').onclick = next;
    if (isRev) armAuto('لوحة الصدارة ←');
  }
  function updateAnswered(){ const el = $('#ansCount'); if (el) el.textContent = toAr(Object.keys(G.answers).length); }
  function renderBoard(){
    const r = ranked().slice(0, 8), last = G.qi + 1 >= G.qs.length;
    app.innerHTML = `
      <div class="board">
        <h2 class="kufi">لوحة الصدارة</h2>
        <div class="rows">${r.length ? r.map((p, i) => `
          <div class="row r${i+1}" style="animation-delay:${i*70}ms"><span class="rk">${toAr(i+1)}</span><span class="nm">${esc(p.s)}<small>${p.g ? 'مع ' + esc(p.g) : ''}</small></span><span class="sc">${toAr(p.score)}</span>${p.last && p.last.pts ? `<span class="gain">+${toAr(p.last.pts)}</span>` : ''}</div>`).join('') : '<div class="empty" style="text-align:center">لا توجد فرق</div>'}
        </div>
        <div style="display:flex;justify-content:center;gap:10px;margin-top:24px"><button class="btn ghost hidden" id="pauseBtn">⏸ إيقاف مؤقت</button><button class="btn" id="nextBtn">${last ? 'إعلان الفائزين 🏆' : 'السؤال التالي ←'}</button></div>
      </div>`;
    $('#nextBtn').onclick = next;
    armAuto(last ? 'إعلان الفائزين 🏆' : 'السؤال التالي ←');
  }
  function renderFinal(){
    clearInterval(tick);
    const r = ranked();
    const pod = (p, k) => p ? `<div class="pod p${k}"><div class="who">${esc(p.s)}<small>${p.g ? 'مع ' + esc(p.g) : ''}</small></div><div class="pts">${toAr(p.score)} نقطة</div><div class="block">${toAr(k)}</div></div>` : '';
    app.innerHTML = `
      <div class="board">
        <h2 class="kufi">🏆 الفائزون 🏆</h2>
        <div class="podium">${pod(r[1],2)}${pod(r[0],1)}${pod(r[2],3)}</div>
        <div class="rows">${r.slice(3, 15).map((p, i) => `<div class="row" style="animation-delay:${i*50}ms"><span class="rk">${toAr(i+4)}</span><span class="nm">${esc(p.s)}<small>${p.g ? 'مع ' + esc(p.g) : ''}</small></span><span class="sc">${toAr(p.score)}</span></div>`).join('')}</div>
        <div style="display:flex;justify-content:center;gap:10px;margin-top:24px;flex-wrap:wrap">
          <button class="btn ghost" id="csvBtn">تنزيل النتائج</button>
          <button class="btn" id="newBtn">مسابقة جديدة</button>
        </div>
      </div>`;
    confetti();
    $('#newBtn').onclick = () => { if (confirm('إنهاء هذه المسابقة والعودة للإعداد؟')) endRoom(); };
    $('#csvBtn').onclick = () => {
      const rows = [['الترتيب','اسم الطالب/ة','ولي الأمر','النقاط']].concat(r.map((p,i)=>[i+1,p.s,p.g,p.score]));
      const csv = '﻿' + rows.map(x => x.map(v => '"' + String(v).replace(/"/g,'""') + '"').join(',')).join('\n');
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download = 'نتائج-المسابقة.csv'; a.click();
    };
  }
  function endRoom(){
    clearInterval(tick); clearInterval(autoT);
    if (net && G){ G.phase = 'closed'; net.publish(T + '/s', JSON.stringify({v:1, phase:'closed'}), true); }
    sdel('qms_game'); G = null; renderSetup();
  }
  function confetti(){
    const box = $('#confetti'); box.innerHTML = '';
    const colors = ['#d6a640','#f3d58a','#ffffff','#2e8b57','#c0392b','#1f6fb5'];
    for (let i = 0; i < 120; i++){
      const el = document.createElement('i');
      el.style.left = Math.random()*100 + 'vw'; el.style.background = colors[i % colors.length];
      el.style.animationDuration = (2.5 + Math.random()*2.5) + 's'; el.style.animationDelay = Math.random()*1.5 + 's';
      box.appendChild(el);
    }
    setTimeout(() => box.innerHTML = '', 7000);
  }
  let actx = null;
  function beep(f, d){
    try { actx = actx || new (window.AudioContext||window.webkitAudioContext)(); const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = f; o.type = 'sine'; g.gain.value = .12; o.connect(g); g.connect(actx.destination); o.start();
      g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + d); o.stop(actx.currentTime + d + .02); } catch(e){}
  }
  document.addEventListener('keydown', e => {
    if (!G || ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)) return;
    if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowLeft'){ e.preventDefault(); if (G.phase !== 'final') next(); }
  });

  setNet('wait'); $('#netTxt').textContent = 'غير متصل بعد';
  renderSetup();
}

/* ================= PLAYER ================= */
function playerMain(){
  const key = 'qms_me_' + ROOM + (LOCAL_TEST ? (params.get('pid')||'') : '');
  let me = sget(key, null);               // {id, s, g}
  let S = null;                           // last state
  let net = null, T = PREFIX + ROOM;
  let myAns = sget(key + '_ans', {});     // seq -> option
  let qTimer = null, joinTimer = null, localEnd = 0, lastSeq = -1;

  function renderJoin(err){
    app.innerHTML = `
      <div class="phone"><div class="panel">
        <h2 class="kufi">أهلًا بكم في المسابقة 🌙</h2>
        <p class="sub">كل فريق مكوّن من الطالب/ة ووليّ الأمر. اكتبوا الاسمين ثم اضغطوا «انضمام».</p>
        ${err ? `<div class="err">${esc(err)}</div>` : ''}
        <label class="f">اسم الطالب/ة<input id="sIn" maxlength="30" autocomplete="off" value="${esc(me?.s||'')}"></label>
        <label class="f">اسم وليّ الأمر<input id="gIn" maxlength="30" autocomplete="off" value="${esc(me?.g||'')}"></label>
        <button class="btn" id="joinBtn">انضمام</button>
      </div></div>`;
    $('#joinBtn').onclick = () => {
      const s = $('#sIn').value.trim(), g = $('#gIn').value.trim();
      if (!s){ $('#sIn').focus(); return; }
      me = {id: (me && me.id) || rid(12), s, g}; sset(key, me);
      sendJoin(); render();
    };
  }
  function sendJoin(){ if (net && me) net.publish(T + '/p', JSON.stringify({t:'join', id:me.id, s:me.s, g:me.g})); }
  function joined(){ return S && S.n && me && S.n[me.id] !== undefined; }
  function ensureJoined(){
    clearInterval(joinTimer);
    joinTimer = setInterval(() => { if (me && S && !joined() && !(S.rm||[]).includes(me.id)) sendJoin(); }, 3000);
  }

  function onMsg(topic, payload){
    if (topic !== T + '/s') return;
    if (!payload){ S = {phase:'closed'}; render(); return; }
    try { S = JSON.parse(payload); } catch(e){ return; }
    if (S.phase === 'question' && S.seq !== lastSeq){ lastSeq = S.seq; localEnd = Date.now() + (S.left ?? S.time*1000) - 300; }
    render();
  }

  function tagHtml(){ return me ? `<div class="tagname">${esc(me.s)}${me.g ? `<small>مع ${esc(me.g)}</small>` : ''}</div>` : ''; }
  function render(){
    clearInterval(qTimer);
    if (!me) return renderJoin();
    if (me && S && (S.rm||[]).includes(me.id)){ app.innerHTML = `<div class="phone"><div class="center"><div class="big-emoji">🚫</div><h2>تمت إزالة هذا الفريق</h2><p>تواصلوا مع المشرف إن كان ذلك بالخطأ.</p></div></div>`; return; }
    if (!S){ app.innerHTML = `<div class="phone"><div class="center"><div class="big-emoji">⏳</div><h2>جارٍ الاتصال بالمسابقة…</h2><p>تأكدوا من اتصال الهاتف بالإنترنت.</p>${tagHtml()}</div></div>`; return; }
    if (S.phase === 'closed'){ app.innerHTML = `<div class="phone"><div class="center"><div class="big-emoji">🌙</div><h2>انتهت المسابقة</h2><p>شكرًا لمشاركتكم، بارك الله فيكم.</p></div></div>`; return; }
    $('#brandTitle').textContent = S.title || 'المسابقة الثقافية';
    if (!joined()){
      app.innerHTML = `<div class="phone"><div class="center"><div class="big-emoji">📡</div><h2>جارٍ تسجيل فريقكم…</h2>${tagHtml()}<button class="btn ghost sm" id="editBtn" style="width:auto;margin-top:10px">تعديل الأسماء</button></div></div>`;
      $('#editBtn').onclick = () => renderJoin();
      return;
    }
    if (S.phase === 'lobby'){
      app.innerHTML = `<div class="phone"><div class="center"><div class="big-emoji">✅</div><h2>تم تسجيلكم!</h2>${tagHtml()}<p>انظروا إلى الشاشة الكبيرة.<br>ستبدأ المسابقة بعد قليل…</p><p style="font-size:14px">عدد الفرق: ${toAr(Object.keys(S.n).length)}</p></div></div>`;
      return;
    }
    if (S.phase === 'question'){
      const mine = myAns[S.seq];
      const sentAck = (S.answered||[]).includes(me.id);
      if (mine !== undefined || sentAck){
        app.innerHTML = `<div class="phone"><div class="center"><div class="big-emoji">${sentAck ? '📨' : '⏳'}</div><h2>${sentAck ? 'وصلت إجابتكم' : 'جارٍ إرسال الإجابة…'}</h2>${mine!==undefined ? `<div class="pbtn c${mine}" style="width:100%;pointer-events:none"><span class="shape">${SHAPES[mine]}</span>${esc(S.options[mine])}</div>` : ''}<p>انتظروا إعلان الإجابة الصحيحة على الشاشة</p></div></div>`;
        if (mine !== undefined && !sentAck) { setTimeout(() => { if (S && S.phase==='question' && !(S.answered||[]).includes(me.id)) sendAnswer(mine, true); }, 2500); }
        return;
      }
      app.innerHTML = `
        <div class="phone">
          <div class="pmeta"><span>السؤال ${toAr(S.qi+1)} من ${toAr(S.total)}</span><span class="t" id="pt"></span></div>
          <div class="pq">${esc(S.text)}</div>
          <div class="pbtns">${S.options.map((o, j) => `<button class="pbtn c${j}" data-a="${j}"><span class="shape">${SHAPES[j]}</span><span>${esc(o)}</span></button>`).join('')}</div>
        </div>`;
      document.querySelectorAll('.pbtn').forEach(b => b.onclick = () => sendAnswer(+b.dataset.a));
      const upd = () => { const left = Math.max(0, localEnd - Date.now()); const el = $('#pt'); if (el) el.textContent = toAr(Math.ceil(left/1000)); if (left <= 0){ clearInterval(qTimer); app.innerHTML = `<div class="phone"><div class="center"><div class="big-emoji">⌛</div><h2>انتهى الوقت</h2><p>انظروا إلى الشاشة لمعرفة الإجابة</p></div></div>`; } };
      upd(); qTimer = setInterval(upd, 250);
      return;
    }
    if (S.phase === 'reveal' || S.phase === 'board'){
      const r = (S.res||{})[me.id]; if (!r) return;
      const [c, pts, score, rank, a] = r;
      const cls = c===1 ? 'ok' : c===0 && a>=0 ? 'bad' : 'none';
      app.innerHTML = `
        <div class="phone"><div class="center">
          <div class="result ${cls}">
            <div class="big-emoji">${c===1 ? '🎉' : a>=0 ? '😔' : '⌛'}</div>
            <h2>${c===1 ? 'إجابة صحيحة!' : a>=0 ? 'إجابة خاطئة' : 'لم تُرسَل إجابة'}</h2>
            ${c===1 ? `<div class="gain">+${toAr(pts)} نقطة</div>` : `<p style="color:#fff;margin-top:8px">الإجابة الصحيحة: ${esc(S.options?.[S.correct]||'')}</p>`}
          </div>
          <div class="stats"><div class="stat"><b>${toAr(score)}</b><span>مجموع النقاط</span></div><div class="stat"><b>${toAr(rank)}</b><span>الترتيب من ${toAr(S.np||Object.keys(S.n).length)}</span></div></div>
          <p>استعدوا للسؤال التالي…</p>
        </div></div>`;
      return;
    }
    if (S.phase === 'final'){
      const r = (S.res||{})[me.id]; if (!r) return;
      const rank = r[3], score = r[2];
      const medal = rank===1 ? '🥇' : rank===2 ? '🥈' : rank===3 ? '🥉' : '🌟';
      app.innerHTML = `
        <div class="phone"><div class="center">
          <div class="big-emoji">${medal}</div>
          <h2>${rank<=3 ? 'مبارك! أنتم من الفائزين' : 'أحسنتم! بارك الله فيكم'}</h2>
          ${tagHtml()}
          <div class="stats"><div class="stat"><b>${toAr(rank)}</b><span>الترتيب النهائي</span></div><div class="stat"><b>${toAr(score)}</b><span>مجموع النقاط</span></div></div>
          <p>شكرًا لمشاركتكم في مسابقة مدرسة مسلمات 🌙</p>
        </div></div>`;
    }
  }
  function sendAnswer(a, resend){
    if (!S || S.phase !== 'question') return;
    if (!resend && myAns[S.seq] !== undefined) return;
    myAns[S.seq] = a; sset(key + '_ans', myAns);
    net.publish(T + '/p', JSON.stringify({t:'ans', id:me.id, q:S.qi, a}));
    if (!resend){ try { navigator.vibrate?.(40); } catch(e){} render(); }
  }

  render();
  connectTransport(onMsg).then(n => {
    net = n; net.subscribe(T + '/s');
    net.onConnect(() => { if (me) sendJoin(); });
    ensureJoined();
  }).catch(() => { setNet('off'); app.innerHTML = `<div class="phone"><div class="center"><div class="big-emoji">⚠️</div><h2>تعذّر الاتصال</h2><p>تأكدوا من اتصال الهاتف بالإنترنت ثم أعيدوا فتح الرابط.</p></div></div>`; });
}

/* ================= boot ================= */
if (ROOM) playerMain();
else { hostMain(); loadScript(['https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js']).catch(()=>{}); }
</script>
</body>
</html>
